name: Playwright UI Tests

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser
        required: false
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Compile
        run: mvn -B compile -pl web --also-make --no-transfer-progress

  test:
    needs: build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Build
        run: mvn -B install -DskipTests --no-transfer-progress
      - name: Install browsers
        working-directory: web
        run: mvn -B exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps" -Dexec.classpathScope=test --no-transfer-progress
      - name: Run tests
        run: mvn -B test -pl web --no-transfer-progress -Dbrowser=${{ inputs.browser || 'chromium' }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: allure-results-web
          path: web/target/allure-results
          retention-days: 7

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: allure-results-web
          path: web/target/allure-results
      - uses: ./.github/actions/allure-pages
        with:
          module: web
