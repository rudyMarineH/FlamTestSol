name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Compile
        run: mvn -B compile -pl web --also-make --no-transfer-progress

  test:
    needs: build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Build
        run: mvn -B install -DskipTests --no-transfer-progress

      - name: Install browsers
        run: mvn -B exec:java -pl web -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps" --no-transfer-progress

      - name: Run tests
        run: mvn -B test --no-transfer-progress

      - name: Publish Allure report
        uses: ./.github/actions/allure-pages
        if: always()
        with:
          module: web
