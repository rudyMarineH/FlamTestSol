name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Build
        run: mvn -B install -DskipTests --no-transfer-progress

      - name: Install browsers
        run: mvn -B exec:java -pl web -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps" --no-transfer-progress

      - name: Run tests
        run: mvn -B test --no-transfer-progress

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: '**/target/allure-results'
          retention-days: 7
