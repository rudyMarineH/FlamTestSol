name: Api Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ develop, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Compile
        run: mvn -B compile -pl api --also-make --no-transfer-progress

  test:
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Run API tests
        env:
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
        run: mvn -B test -pl api --also-make --no-transfer-progress
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: allure-results-api
          path: api/target/allure-results
          retention-days: 7

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: allure-results-api
          path: api/target/allure-results
      - uses: ./.github/actions/allure-pages
        with:
          module: api
