name: Publish Allure to GitHub Pages
description: Generate Allure HTML report with Maven and publish to GitHub Pages
inputs:
  module:
    required: true
    description: Maven module to generate report for (e.g. api, web)
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v6
      with:
        name: allure-results-${{ inputs.module }}
        path: ${{ inputs.module }}/target/allure-results
        retention-days: 7

    - name: Generate Allure report
      shell: bash
      run: mvn -B allure:report -pl ${{ inputs.module }} --no-transfer-progress

    - uses: allure-framework/allure-action@v0
      with:
        report-directory: ${{ inputs.module }}/target/site/allure-maven-plugin
        github-token: ${{ github.token }}
        remote-href: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ inputs.module }}/

    - uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ github.token }}
        publish_branch: gh-pages
        publish_dir: ${{ inputs.module }}/target/site/allure-maven-plugin
        destination_dir: ${{ inputs.module }}
